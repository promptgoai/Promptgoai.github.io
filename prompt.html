<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>Prompt Detail</title>

<link rel="stylesheet" href="style.css">

</head>

<body>



<section class="container">

<div id="promptDetail"></div>



<h3 style="margin-top:40px;text-align:center;color:#38bdf8;">
Related Prompts
</h3>

<div id="relatedPrompts" class="cards"></div>



</section>



<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
doc,
getDoc,
collection,
getDocs,
query,
where,
updateDoc,
increment

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



/* Firebase Config */

const app = initializeApp({

apiKey: "AIzaSyAbTMOKPD5_YE0Z3iKnDzl_40plYxCyug",

authDomain: "promptgoai.firebaseapp.com",

projectId: "promptgoai",

storageBucket: "promptgoai.firebasestorage.app",

messagingSenderId: "500683349924",

appId: "1:500683349924:web:a34bdeba6954ec69272b31"

});



const db = getFirestore(app);



/* URL PARAM */

const url = new URLSearchParams(window.location.search);

const id = url.get("id");



/* LOAD PROMPT */

async function loadPrompt(){



const snap = await getDoc(doc(db,"prompts",id));

if(!snap.exists()) return;



let p = snap.data();



/* Views Increment Safe Mode */

try{

await updateDoc(doc(db,"prompts",id),{

views: increment(1)

});

}catch(e){

console.log("Views update error");

}



document.getElementById("promptDetail").innerHTML = `

<div class="card">



<img src="${p.image||''}"

style="width:100%;max-height:650px;object-fit:cover;border-radius:14px;">



<h2 style="margin-top:20px;color:#38bdf8">

${p.title||"Untitled Prompt"}

</h2>



<div style="margin-top:15px">



<button class="btn" onclick="togglePrompt()">

View Prompt

</button>



<button class="btn" onclick="copyPrompt()">

Copy Prompt

</button>



<button class="btn" onclick="likePrompt()">

❤️ ${p.likes||0}

</button>



</div>



<p id="fullPrompt"

style="display:none;white-space:pre-wrap;margin-top:25px">

${p.text||""}

</p>



<button class="btn"

onclick="hidePrompt()"

id="hideBtn"

style="display:none;margin-top:15px">

Hide Prompt

</button>



</div>

`;



loadRelated(p.category||"");

}



/* RELATED PROMPTS */

async function loadRelated(category){



const q = query(

collection(db,"prompts"),

where("category","==",category || "")

);



const snap = await getDocs(q);



let html = "";

let count = 0;



snap.forEach(doc=>{



if(doc.id === id) return;

if(count >= 8) return;

count++;



let d = doc.data();



html += `

<a href="prompt.html?id=${doc.id}" class="card">



<img src="${d.image||''}">



<h4>${d.title||""}</h4>



</a>

`;



});



document.getElementById("relatedPrompts").innerHTML = html;

}



/* VIEW TOGGLE */

window.togglePrompt=function(){

document.getElementById("fullPrompt").style.display="block";

document.getElementById("hideBtn").style.display="inline-block";

}



/* HIDE */

window.hidePrompt=function(){

document.getElementById("fullPrompt").style.display="none";

document.getElementById("hideBtn").style.display="none";

}



/* COPY */

window.copyPrompt=function(){

let text=document.getElementById("fullPrompt").innerText;

navigator.clipboard.writeText(text);

alert("Copied ✅");

}



/* LIKE SYSTEM */

window.likePrompt=async function(){



try{

await updateDoc(doc(db,"prompts",id),{

likes: increment(1)

});

}catch(e){

console.log("Like error");

}



loadPrompt();

}



/* INIT */

loadPrompt();



</script>



</body>

</html>
