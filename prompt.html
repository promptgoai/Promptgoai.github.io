<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prompt Detail</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="container">

<div id="promptDetail"></div>

<h3 style="margin-top:40px;text-align:center;color:#38bdf8;">
Related Prompts
</h3>

<div id="relatedPrompts" class="cards"></div>

</section>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

getFirestore,
doc,
getDoc,
collection,
getDocs,
query,
where,
updateDoc,
increment

} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const app = initializeApp({

apiKey: "AIzaSyAbTMOKPD5_YE0Z3iKNdZvl_40plYxCyug",
authDomain: "promptgoai.firebaseapp.com",
projectId: "promptgoai",
storageBucket: "promptgoai.firebasestorage.app",
messagingSenderId: "500683349924",
appId: "1:500683349924:web:a34bdeba6954ec69272b31"

});

const db = getFirestore(app);


const url = new URLSearchParams(window.location.search);
const id = url.get("id");


async function loadPrompt(){

const snap = await getDoc(doc(db,"prompts",id));

if(!snap.exists()) return;

let p = snap.data();


/* VIEW COUNT */

try{

await updateDoc(doc(db,"prompts",id),{
views:increment(1)
});

}catch(e){}


/* PROMPT ARRAY SUPPORT */

let prompts=[];

if(p.prompts){

prompts=p.prompts;

}else{

prompts=[{
image:p.image,
text:p.text
}];

}


let html=`

<h2 style="text-align:center;color:#38bdf8;margin-bottom:30px">
${p.title||"Untitled Prompt"}
</h2>

<div class="prompt-gallery">

`;


/* LOOP PROMPTS */

prompts.forEach((item,i)=>{

html+=`

<div class="prompt-box">

<img src="${item.image||''}">

<div style="margin-top:10px">

<button class="btn"
onclick="viewPrompt(${i})"
id="view${i}">
View Prompt
</button>

<button class="btn"
onclick="copyPrompt(${i})">
Copy Prompt
</button>

<button class="btn"
onclick="likePrompt()">
❤️ ${p.likes||0}
</button>

</div>

<p id="prompt${i}"
style="display:none;white-space:pre-wrap;margin-top:15px">

${item.text||""}

</p>

<button class="btn"
onclick="hidePrompt(${i})"
id="hide${i}"
style="display:none;margin-top:10px">
Hide Prompt
</button>

</div>

`;

});


html+=`</div>`;


document.getElementById("promptDetail").innerHTML=html;

loadRelated(p.category||"");

}



/* RELATED PROMPTS */

async function loadRelated(category){

const q=query(
collection(db,"prompts"),
where("category","==",category)
);

const snap=await getDocs(q);

let html="";
let count=0;

snap.forEach(d=>{

if(d.id===id) return;
if(count>=8) return;

count++;

let p=d.data();

let img=p.image;

if(!img && p.prompts)
img=p.prompts[0].image;

html+=`

<a href="prompt.html?id=${d.id}" class="card">

<img src="${img||''}">

<h4>${p.title||""}</h4>

</a>

`;

});

document.getElementById("relatedPrompts").innerHTML=html;

}



/* VIEW PROMPT */

window.viewPrompt=function(i){

document.getElementById("prompt"+i).style.display="block";
document.getElementById("hide"+i).style.display="inline-block";
document.getElementById("view"+i).style.display="none";

}



/* HIDE PROMPT */

window.hidePrompt=function(i){

document.getElementById("prompt"+i).style.display="none";
document.getElementById("hide"+i).style.display="none";
document.getElementById("view"+i).style.display="inline-block";

}



/* COPY PROMPT */

window.copyPrompt=function(i){

let text=document.getElementById("prompt"+i).innerText;

navigator.clipboard.writeText(text);

alert("Copied ✅");

}



/* LIKE PROMPT */

window.likePrompt=async function(){

await updateDoc(doc(db,"prompts",id),{
likes:increment(1)
});

loadPrompt();

}



/* INIT */

loadPrompt();

</script>

</body>
</html>
