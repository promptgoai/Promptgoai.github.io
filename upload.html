<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Upload Prompt</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<script>
let pass = prompt("Enter Admin Password");
if(pass !== "12345"){
alert("Access Denied");
location.href = "index.html";
}
</script>

<div class="container">
<h2>Upload Prompt</h2>

<input type="text" id="title" placeholder="Enter Prompt Title">
<textarea id="text" placeholder="Enter Full Prompt"></textarea>

<!-- Image URL -->
<input type="text" id="image" placeholder="Image URL (Optional)">

<!-- OR Image Upload -->
<input type="file" id="fileInput" accept="image/*">

<input type="text" id="keywords" placeholder="Keywords (comma separated)">

<select id="category">
<option value="">Select Category</option>
<option value="gemini">Gemini</option>
<option value="chatgpt">ChatGPT</option>
<option value="business">Business</option>
</select>

<button onclick="addPrompt()">Upload Prompt</button>

<p id="message" style="margin-top:10px;text-align:center;"></p>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey:"PASTE_YOUR_FIREBASE_API_KEY",
authDomain:"promptgoai.firebaseapp.com",
projectId:"promptgoai",
storageBucket:"promptgoai.firebasestorage.app",
messagingSenderId:"500683349924",
appId:"1:500683349924:web:a34bdeba6954ec69272b31"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.addPrompt = async function(){

let title = document.getElementById("title").value.trim();
let text = document.getElementById("text").value.trim();
let imageURL = document.getElementById("image").value.trim();
let file = document.getElementById("fileInput").files[0];
let keywordsInput = document.getElementById("keywords").value.trim();
let category = document.getElementById("category").value;
let messageBox = document.getElementById("message");

if(!title || !text || !category){
messageBox.style.color="red";
messageBox.innerText="Please fill required fields!";
return;
}

messageBox.style.color="white";
messageBox.innerText="Uploading... ⏳";

let finalImageURL = "";

/* If file selected → Upload to ImgBB */
if(file){

let formData = new FormData();
formData.append("image", file);

try{
let response = await fetch("https://api.imgbb.com/1/upload?key=3c2d8f5c5bfbbf43d0d439e931e089a3",{
method:"POST",
body:formData
});

let data = await response.json();
finalImageURL = data.data.url;

}catch(error){
messageBox.style.color="red";
messageBox.innerText="Image Upload Failed ❌";
return;
}

}
/* If URL entered */
else if(imageURL){

if(!imageURL.startsWith("http")){
messageBox.style.color="red";
messageBox.innerText="Invalid Image URL!";
return;
}

finalImageURL = imageURL;
}

/* Keywords clean */
let keywords = keywordsInput 
? keywordsInput.split(",").map(k => k.trim()).filter(k => k !== "")
: [];

try{

await addDoc(collection(db,"prompts"),{
title,
text,
image: finalImageURL,
keywords,
category,
likes:0,
views:0,
created:Date.now()
});

messageBox.style.color="lightgreen";
messageBox.innerText="Upload Successful ✅";

/* Clear form */
document.getElementById("title").value="";
document.getElementById("text").value="";
document.getElementById("image").value="";
document.getElementById("keywords").value="";
document.getElementById("category").value="";
document.getElementById("fileInput").value="";

}catch(error){
console.log(error);
messageBox.style.color="red";
messageBox.innerText="Upload Failed ❌";
}

}
</script>

</body>
</html>
