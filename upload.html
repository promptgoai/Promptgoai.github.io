<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Upload</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<script>
let pass=prompt("Enter Admin Password");
if(pass!=="12345"){alert("Access Denied");location.href="index.html";}
</script>

<div class="container">
<h2>Upload Prompt</h2>

<input type="text" id="title" placeholder="Title">
<textarea id="text" placeholder="Full Prompt"></textarea>
<input type="text" id="image" placeholder="Image URL">
<input type="text" id="keywords" placeholder="Keywords comma separated">

<select id="category">
<option value="">Category</option>
<option value="gemini">Gemini</option>
<option value="chatgpt">ChatGPT</option>
<option value="business">Business</option>
</select>

<button onclick="addPrompt()">Upload</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = { apiKey:"PASTE_YOUR_REAL_API_KEY",authDomain:"promptgoai.firebaseapp.com",projectId:"promptgoai" };

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

window.addPrompt=async function(){
let title=document.getElementById("title").value;
let text=document.getElementById("text").value;
let image=document.getElementById("image").value;
let keywords=document.getElementById("keywords").value.split(",");
let category=document.getElementById("category").value;

if(!title||!text||!image||!category){alert("Fill all fields");return;}

await addDoc(collection(db,"prompts"),{
title,text,image,keywords,category,
likes:0,
views:0,
created:Date.now()
});

alert("Uploaded ✅");
}
</script>

</body>
</html>
