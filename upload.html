<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Upload Panel</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<script>
let pass=prompt("Enter Admin Password");
if(pass!=="12345"){
alert("Access Denied");
location.href="index.html";
}
</script>

<div class="container">
<h2>Admin Upload Panel</h2>

<input type="text" id="title" placeholder="Prompt Title">

<textarea id="text" placeholder="Full Prompt"></textarea>

<input type="text" id="image" placeholder="Image URL OR Select File Below">

<input type="file" id="fileInput" accept="image/*">

<input type="text" id="keywords" placeholder="Keywords">

<select id="category">
<option value="">Select Category</option>
<option value="gemini">Gemini</option>
<option value="chatgpt">ChatGPT</option>
<option value="Flow">Flow</option>
</select>

<button class="btn" onclick="addPrompt()">Upload Prompt</button>

<p id="message" style="text-align:center;margin-top:10px;"></p>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
apiKey:"PASTE_FIREBASE_KEY",
authDomain:"promptgoai.firebaseapp.com",
projectId:"promptgoai",
storageBucket:"promptgoai.firebasestorage.app",
appId:"1:promptgoai:web:a34bdeba6954ec69272b31"
});

const db=getFirestore(app);

/* ImgBB Key */
const IMGBB_KEY="3c2d8f5c5bfbbf43d0d439e931e089a3";

window.addPrompt=async function(){

let title=document.getElementById("title").value.trim();
let text=document.getElementById("text").value.trim();
let imageURL=document.getElementById("image").value.trim();
let file=document.getElementById("fileInput").files[0];
let keywords=document.getElementById("keywords").value.split(",");
let category=document.getElementById("category").value;

if(!title||!text||!category){
alert("Fill required fields");
return;
}

let finalImage="";

/* Upload Image */

if(file){

let form=new FormData();
form.append("image",file);

let res=await fetch("https://api.imgbb.com/1/upload?key="+IMGBB_KEY,{
method:"POST",
body:form
});

let data=await res.json();
finalImage=data.data.url;

}else{
finalImage=imageURL;
}

await addDoc(collection(db,"prompts"),{
title,
text,
image:finalImage,
keywords,
category,
subcategory:"",
likes:0,
created:Date.now()
});

document.getElementById("message").innerText="Upload Success ✅";

document.getElementById("title").value="";
document.getElementById("text").value="";
document.getElementById("image").value="";
document.getElementById("keywords").value="";
document.getElementById("fileInput").value="";
};

</script>

</body>
</html>
