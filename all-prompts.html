<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>All Prompts - PromptGoAI</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial, sans-serif;
margin:0;
}

nav{
display:flex;
justify-content:space-between;
padding:20px 8%;
background:#0b1220;
}

nav h1{
color:#38bdf8;
}

nav ul{
display:flex;
gap:20px;
list-style:none;
}

nav ul li a{
color:white;
text-decoration:none;
font-weight:bold;
}

/* Section */

.section{
padding:80px 8%;
text-align:center;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
margin-top:40px;
}

/* Card */

.card{
background:linear-gradient(145deg,#1e293b,#0f172a);
padding:25px;
border-radius:20px;
transition:0.3s;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.card img{
width:100%;
border-radius:10px;
margin-bottom:15px;
}

.card p{
color:#cbd5e1;
margin-top:10px;
}

.btn{
display:inline-block;
padding:10px 20px;
background:#38bdf8;
color:#0f172a;
border-radius:25px;
font-weight:bold;
margin-top:12px;
cursor:pointer;
border:none;
}

footer{
background:#0b1220;
padding:20px;
text-align:center;
color:#94a3b8;
margin-top:60px;
}

</style>
</head>

<body>

<nav>
<h1>PromptGoAI</h1>

<ul>
<li><a href="index.html">Home</a></li>
<li><a href="all-prompts.html">All Prompts</a></li>
</ul>
</nav>

<section class="section">

<h2>🚀 All AI Prompts</h2>

<div style="margin-bottom:25px;">
<button class="btn" onclick="loadCategory('all')">All</button>
<button class="btn" onclick="loadCategory('gemini')">Gemini</button>
<button class="btn" onclick="loadCategory('chatgpt')">ChatGPT</button>
<button class="btn" onclick="loadCategory('business')">Business</button>
</div>

<div class="cards" id="promptList"></div>

</section>

<footer>
© 2026 PromptGoAI | Built with ❤️ by Arsh
</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAbTMOKPD5_YE0Z0I2pl40plYxCyug",
authDomain: "promptgoai.firebaseapp.com",
projectId: "promptgoai",
storageBucket: "promptgoai.firebasestorage.app",
messagingSenderId: "500683349924",
appId: "1:promptgoai:web:a34bdeba6954ec69272b31"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* Category Loader */

window.loadCategory = async function(cat){

const promptList = document.getElementById("promptList");

promptList.innerHTML="";

let q;

if(cat === "all"){
q = query(collection(db,"prompts"));
}else{
q = query(collection(db,"prompts"), where("category","==",cat));
}

const snapshot = await getDocs(q);

snapshot.forEach(doc=>{
let data = doc.data();

promptList.innerHTML += `
<div class="card">

<img src="${data.image}" 
style="width:100%;border-radius:10px;" 
onerror="this.style.display='none'">

<p>
${data.text.length > 80 ? data.text.substring(0,80)+"..." : data.text}
</p>

<button class="btn" onclick="navigator.clipboard.writeText('${data.text}')">
Copy Prompt
</button>

</div>
`;
});

}

/* Default Load */

loadCategory("all");

</script>

</body>
</html>
