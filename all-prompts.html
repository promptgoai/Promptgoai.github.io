<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All AI Prompts - PromptGoAI</title>

<style>
body <div class="container" id="promptContainer"></div>
    
<body>

<nav>
    <div>PromptGoAI</div>
    <div>
        <a href="index.html">Home</a>
    </div>
</nav>

<header>
    <h1>All AI Prompts</h1>
    <p>Explore Powerful Prompts for Content, Business, Study & Coding</p>
</header>

<div class="container" id="promptContainer"></div>
<script>
<script>
fetch('prompts.json')
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById('promptContainer');

    data.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <h3>${item.title}</h3>
        <img src="${item.image}" width="100%" style="border-radius:10px;">
        <p id="prompt${index}">${item.prompt}</p>
        <button onclick="copyText('prompt${index}')">Copy Prompt</button>
      `;

      container.appendChild(card);
    });
  });

function copyText(id) {
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text);
  alert("Prompt Copied!");
}
</script>
</script>

</body>
</html>
