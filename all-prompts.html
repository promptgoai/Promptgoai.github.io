<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>All Prompts</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
<h1>PromptGoAI</h1>
</nav>

<section class="section">
<h2>🚀 All Prompts</h2>

<input type="text" id="searchInput" placeholder="Search prompts..." class="search">

<div class="filter">
<button class="btn" onclick="loadCategory('all')">All</button>
<button class="btn" onclick="loadCategory('gemini')">Gemini</button>
<button class="btn" onclick="loadCategory('chatgpt')">ChatGPT</button>
<button class="btn" onclick="loadCategory('business')">Business</button>
</div>

<div class="cards" id="promptList"></div>
</section>

<footer>© 2026 PromptGoAI</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, orderBy, getDocs, updateDoc, doc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey:"PASTE_YOUR_REAL_API_KEY",
authDomain:"promptgoai.firebaseapp.com",
projectId:"promptgoai",
storageBucket:"promptgoai.firebasestorage.app",
messagingSenderId:"500683349924",
appId:"1:500683349924:web:a34bdeba6954ec69272b31"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let allData=[];

/* LIKE */
window.likePrompt=async function(id){
await updateDoc(doc(db,"prompts",id),{likes:increment(1)});
loadCategory("all");
}

/* VIEW */
window.viewPrompt=async function(id){
await updateDoc(doc(db,"prompts",id),{views:increment(1)});
}

/* COPY */
window.copyPrompt=function(text){
navigator.clipboard.writeText(text).then(()=>{
alert("Copied ✅");
});
}

/* READ MORE */
window.toggleReadMore=function(id,fullText){
let el=document.getElementById("preview-"+id);

if(el.dataset.expanded==="true"){
el.innerText=fullText.substring(0,100)+"...";
el.dataset.expanded="false";
}else{
el.innerText=fullText;
el.dataset.expanded="true";
viewPrompt(id);
}
}

window.loadCategory=async function(cat){

let q;
if(cat==="all"){
q=query(collection(db,"prompts"),orderBy("created","desc"));
}else{
q=query(collection(db,"prompts"),where("category","==",cat),orderBy("created","desc"));
}

const snap=await getDocs(q);
allData=[];
snap.forEach(d=>{
allData.push({id:d.id,...d.data()});
});
displayPrompts(allData);
}

function displayPrompts(data){
const list=document.getElementById("promptList");
list.innerHTML="";

data.forEach(p=>{
let preview=p.text.length>100?p.text.substring(0,100)+"...":p.text;

list.innerHTML+=`
<div class="card">
<img src="${p.image||''}" onerror="this.style.display='none'">
<h3>${p.title}</h3>

<p id="preview-${p.id}" data-expanded="false">
${preview}
</p>

<div class="meta">
<span>❤️ ${p.likes||0}</span>
<span>👁 ${p.views||0}</span>
</div>

<button class="btn" onclick="toggleReadMore('${p.id}', ${JSON.stringify(p.text)})">
Read More
</button>

<button class="btn" onclick="copyPrompt(${JSON.stringify(p.text)})">
Copy
</button>

<button class="btn" onclick="likePrompt('${p.id}')">
Like
</button>

</div>`;
});
}

/* SEARCH */
document.getElementById("searchInput").addEventListener("input",function(){
let val=this.value.toLowerCase();
let filtered=allData.filter(p=>
(p.title && p.title.toLowerCase().includes(val)) ||
(p.text && p.text.toLowerCase().includes(val))
);
displayPrompts(filtered);
});

loadCategory("all");

</script>

</body>
</html>
