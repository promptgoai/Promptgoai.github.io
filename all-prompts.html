<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All AI Prompts - PromptGoAI</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

nav {
    background: #111827;
    padding: 15px 30px;
    display: flex;
    justify-content: space-between;
}

nav a {
    color: white;
    text-decoration: none;
    margin-left: 20px;
}

header {
    text-align: center;
    padding: 50px 20px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    padding: 20px;
}

.card {
    background: #1e293b;
    width: 280px;
    margin: 15px;
    padding: 20px;
    border-radius: 12px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

button {
    margin-top: 10px;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}
</style>
</head>

<body>

<nav>
    <div>PromptGoAI</div>
    <div>
        <a href="index.html">Home</a>
    </div>
</nav>

<header>
    <h1>All AI Prompts</h1>
    <p>Explore Powerful Prompts for Content, Business, Study & Coding</p>
</header>

<div class="container" id="promptContainer"></div>
<script>
<script>
fetch('prompts.json')
  .then(response => response.json())
  .then(data => {
    const container = document.getElementById('promptContainer');

    data.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <h3>${item.title}</h3>
        <img src="${item.image}" width="100%" style="border-radius:10px;">
        <p id="prompt${index}">${item.prompt}</p>
        <button onclick="copyText('prompt${index}')">Copy Prompt</button>
      `;

      container.appendChild(card);
    });
  });

function copyText(id) {
  const text = document.getElementById(id).innerText;
  navigator.clipboard.writeText(text);
  alert("Prompt Copied!");
}
</script>
</script>

</body>
</html>
