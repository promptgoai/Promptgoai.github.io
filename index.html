<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PromptGoAI</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
<h1>PromptGoAI</h1>

<div class="nav-menu">
<select id="navCategory" onchange="filterCategory()">
<option value="all">All</option>
<option value="gemini">Gemini</option>
<option value="chatgpt">ChatGPT</option>
<option value="business">Business</option>
</select>

<select id="navSubcategory" onchange="filterCategory()">
<option value="">All Sub</option>
</select>
</div>
</nav>

<input type="text" id="searchBox" class="search"
placeholder="Search prompt title..." onkeyup="searchPrompt()">

<section class="cards" id="promptBox"></section>

<footer>© 2026 PromptGoAI</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, where, orderBy, getDocs, updateDoc, doc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
apiKey:"PASTE_KEY",
authDomain:"promptgoai.firebaseapp.com",
projectId:"promptgoai",
storageBucket:"promptgoai.firebasestorage.app",
appId:"1:promptgoai:web:a34bdeba6954ec69272b31"
});

const db=getFirestore(app);

let allData=[];

/* Like */

window.likePrompt=async function(id){
await updateDoc(doc(db,"prompts",id),{
likes:increment(1)
});
loadData();
}

/* Toggle Prompt */

window.togglePrompt=function(id){
let el=document.getElementById("full-"+id);
let btn=document.getElementById("btn-"+id);

if(el.style.display==="none"){
el.style.display="block";
btn.innerText="Hide Prompt";
}else{
el.style.display="none";
btn.innerText="View Prompt";
}
}

/* Copy */

window.copyPrompt=function(id){
let text=document.getElementById("full-"+id).innerText;
navigator.clipboard.writeText(text);
alert("Copied ✅");
}

/* Load Data */

async function loadData(category="all",subcategory=""){

let q;

if(category==="all"){
q=query(collection(db,"prompts"),orderBy("created","desc"));
}else{
q=query(collection(db,"prompts"),where("category","==",category),orderBy("created","desc"));
}

let snap=await getDocs(q);

allData=[];
snap.forEach(d=>allData.push({id:d.id,...d.data()}));

display(allData);
}

/* Display */

function display(data){

let box=document.getElementById("promptBox");
box.innerHTML="";

let search=document.getElementById("searchBox").value.toLowerCase();

data.filter(p=>p.title.toLowerCase().includes(search))
.forEach(p=>{

let short=p.text.substring(0,120)+"...";

box.innerHTML+=`
<div class="card">

<img src="${p.image||''}" onerror="this.style.display='none'">

<h3>${p.title}</h3>

<p id="short-${p.id}">${short}</p>

<p id="full-${p.id}" style="display:none">
${p.text}
</p>

<button class="btn" id="btn-${p.id}"
onclick="togglePrompt('${p.id}')">
View Prompt
</button>

<button class="btn" onclick="copyPrompt('${p.id}')">
Copy
</button>

<button class="btn" onclick="likePrompt('${p.id}')">
❤️ ${p.likes||0}
</button>

</div>
`;
});

}

/* Search */

window.searchPrompt=function(){
display(allData);
}

/* Filter */

window.filterCategory=function(){
let cat=document.getElementById("navCategory").value;
loadData(cat);
}

loadData();

</script>

</body>
</html>
