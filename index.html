<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptGoAI</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav>

<div style="display:flex;align-items:center;gap:10px;cursor:pointer"
onclick="goHome()">

<img src="https://i.ibb.co/zhCrM7wh/20260304-020856.png"
style="height:55px;width:55px;object-fit:contain"
loading="lazy">

</div>

<div class="nav-menu">

<select id="navCategory" onchange="filterCategory()">
<option value="all">All Category</option>
<option value="gemini">Gemini</option>
<option value="chatgpt">ChatGPT</option>
<option value="business">Business</option>
</select>

</div>

</nav>

<input type="text"
class="search"
id="searchBox"
placeholder="Search prompt title..."
onkeyup="searchPrompt()">

<section class="cards" id="promptBox"></section>

<footer>© 2026 PromptGoAI</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
query,
where,
orderBy,
getDocs,
updateDoc,
doc,
increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({
apiKey:"PASTE_FIREBASE_KEY",
authDomain:"promptgoai.firebaseapp.com",
projectId:"promptgoai",
storageBucket:"promptgoai.firebasestorage.app",
appId:"1:promptgoai:web:a34bdeba6954ec69272b31"
});

const db=getFirestore(app);

let allData=[];

/* Routing */

window.openPrompt=function(id){
window.location.href="prompt.html?id="+id;
}

/* Like */

window.likePrompt=async function(id){

await updateDoc(doc(db,"prompts",id),{
likes:increment(1)
});

loadData();

}

/* Load Data */

async function loadData(){

let q=query(collection(db,"prompts"),orderBy("created","desc"));

let snap=await getDocs(q);

allData=[];

snap.forEach(d=>{
allData.push({id:d.id,...d.data()});
});

display(allData);
}

/* Display */

function display(data){

let box=document.getElementById("promptBox");
box.innerHTML="";

let search=document.getElementById("searchBox").value.toLowerCase();

data.filter(p=>p.title.toLowerCase().includes(search))
.forEach(p=>{

box.innerHTML+=`
<div class="card">

<img src="${p.image||''}" loading="lazy"
onerror="this.style.display='none'">

<h3 onclick="openPrompt('${p.id}')"
style="color:#38bdf8;cursor:pointer">
${p.title}
</h3>

<p>${p.text.substring(0,120)}...</p>

<button class="btn" onclick="likePrompt('${p.id}')">
❤️ ${p.likes||0}
</button>

</div>
`;

});
}

/* Search */

window.searchPrompt=function(){
display(allData);
}

/* Home */

window.goHome=function(){
window.location.href="index.html";
}

loadData();

</script>

</body>
</html>
