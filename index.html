<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptGoAI</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1 style="text-align:center;color:#38bdf8;cursor:pointer"
onclick="goHome()">
PromptGoAI
</h1>

<input type="text"
class="search"
id="searchBox"
placeholder="Search prompt..."
onkeyup="searchPrompt()">

<div class="navbar-menu">

<span onclick="filterCategory('latest')">Latest Prompts</span>
<span onclick="filterCategory('gemini')">Gemini</span>
<span onclick="filterCategory('chatgpt')">ChatGPT</span>
<span onclick="filterCategory('flow')">Flow</span>

</div>

<section class="cards" id="promptBox"></section>

<footer>

<div class="footer-title">PromptGoAI</div>
<div>Best AI Prompt Platform</div>

<div class="footer-links">
<a href="index.html">Home</a>
<a href="#">About</a>
<a href="#">Contact</a>
<a href="#">Privacy Policy</a>
</div>

<div style="margin-top:15px">
© 2026 PromptGoAI | All Rights Reserved
</div>

</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore,
collection,
query,
orderBy,
getDocs,
updateDoc,
doc,
increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
apiKey:"AIzaSyAbTMOKPD5_YE0Z3iKNdZvl_40plYxCyug",
authDomain:"promptgoai.firebaseapp.com",
projectId:"promptgoai",
storageBucket:"promptgoai.firebasestorage.app",
appId:"1:500683349924:web:a34bdeba6954ec69272b31"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let allData=[];

/* Load Data */

async function loadData(){

let snap=await getDocs(
query(collection(db,"prompts"),orderBy("created","desc"))
);

allData=[];
snap.forEach(d=>{
allData.push({id:d.id,...d.data()});
});

display(allData);
}

/* Display */

function display(data){

let box=document.getElementById("promptBox");
if(!box) return;

box.innerHTML="";

let search=document.getElementById("searchBox").value.toLowerCase();

data.filter(p=>
p.title.toLowerCase().includes(search)
).forEach(p=>{

box.innerHTML+=`
<div class="card">

<img src="${p.image||''}"
loading="lazy"
onclick="openPrompt('${p.id}')"
style="cursor:pointer;width:100%;object-fit:contain;border-radius:12px;">

<h3 onclick="openPrompt('${p.id}')"
style="color:#38bdf8;cursor:pointer">
${p.title}
</h3>

<p>${p.text.substring(0,120)}...</p>

<button class="btn" onclick="likePrompt('${p.id}')">
❤️ ${p.likes||0}
</button>

</div>
`;

});

}

/* Routing */

window.openPrompt=function(id){
location.href="prompt.html?id="+id;
}

window.goHome=function(){
location.href="index.html";
}

/* Filter */

window.filterCategory=function(cat){

if(cat==="latest"){
display(allData.sort((a,b)=>b.created-a.created));
return;
}

let filtered=allData.filter(p=>p.category===cat);
display(filtered);
}

/* Search */

window.searchPrompt=function(){
display(allData);
}

/* Like */

window.likePrompt=async function(id){

await updateDoc(doc(db,"prompts",id),{
likes:increment(1)
});

loadData();
}

/* Init */

loadData();

</script>

</body>
</html>
