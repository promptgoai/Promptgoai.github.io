<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PromptGoAI</title>


  <link rel="stylesheet" href="style.css">

</head>

<body>

<nav>

<div style="display:flex;align-items:center;gap:10px;cursor:pointer"
onclick="goHome()">

<img src="https://i.ibb.co/zhCrM7wh/20260304-020856.png"
style="height:40px;width:40px;border-radius:8px"
loading="lazy">

<span style="color:#38bdf8;font-size:22px;font-weight:bold">
PromptGoAI
</span>

</div>

<div class="nav-menu">

<select id="navCategory" onchange="filterCategory()">
<option value="all">All Category</option>
<option value="gemini">Gemini</option>
<option value="chatgpt">ChatGPT</option>
<option value="business">Business</option>
</select>

<select id="navSubcategory" onchange="filterCategory()">
<option value="">All Subcategory</option>
</select>

</div>

</nav>

<input type="text"
class="search"
id="searchBox"
placeholder="Search prompt title..."
onkeyup="searchPrompt()">

<section class="cards" id="promptBox"></section>

<footer>© 2026 PromptGoAI</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
orderBy,
getDocs,
updateDoc,
doc,
increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* Firebase Config */

const app=initializeApp({
apiKey:"PASTE_FIREBASE_KEY",
authDomain:"promptgoai.firebaseapp.com",
projectId:"promptgoai",
storageBucket:"promptgoai.firebasestorage.app",
appId:"1:promptgoai:web:a34bdeba6954ec69272b31"
});

const db=getFirestore(app);

let allData=[];

/* Routing */

window.openPrompt=function(id){
window.location.href="prompt.html?id="+id;
}

/* Like System */

window.likePrompt=async function(id){

await updateDoc(doc(db,"prompts",id),{
likes:increment(1)
});

loadData();

}

/* Load Data */

async function loadData(category="all"){

let q;

if(category==="all"){
q=query(collection(db,"prompts"),orderBy("created","desc"));
}else{
q=query(collection(db,"prompts"),
where("category","==",category),
orderBy("created","desc"));
}

let snap=await getDocs(q);

allData=[];

snap.forEach(d=>{
allData.push({
id:d.id,
...d.data()
});
});

display(allData);

}

/* Subcategory Mapping */

const subcategoryMap={
gemini:["holi","eid","diwali","instagram","youtube"],
chatgpt:["business","email","seo"],
business:["startup","marketing","finance"]
};

document.getElementById("navCategory").addEventListener("change",function(){

let sub=document.getElementById("navSubcategory");

sub.innerHTML='<option value="">All Subcategory</option>';

let selected=this.value;

if(subcategoryMap[selected]){
subcategoryMap[selected].forEach(item=>{
let opt=document.createElement("option");
opt.value=item;
opt.innerText=item.charAt(0).toUpperCase()+item.slice(1);
sub.appendChild(opt);
});
}

});

/* Display Prompt Cards */

function display(data){

let box=document.getElementById("promptBox");
box.innerHTML="";

let search=document.getElementById("searchBox").value.toLowerCase();

data.filter(p=>
p.title.toLowerCase().includes(search)
).forEach(p=>{

let short=p.text.substring(0,120)+"...";

box.innerHTML+=`

<div class="card">

<img src="${p.image||''}" loading="lazy"
onerror="this.style.display='none'">

<h3 onclick="openPrompt('${p.id}')"
style="color:#38bdf8;cursor:pointer">
${p.title}
</h3>

<p>${short}</p>

<button class="btn" onclick="likePrompt('${p.id}')">
❤️ ${p.likes||0}
</button>

</div>

`;

});

}

/* Search */

window.searchPrompt=function(){
display(allData);
}

/* Filter */

window.filterCategory=function(){

let cat=document.getElementById("navCategory").value;
let sub=document.getElementById("navSubcategory").value;

let filtered=allData;

if(cat!=="all"){
filtered=filtered.filter(p=>p.category===cat);
}

if(sub){
filtered=filtered.filter(p=>p.subcategory===sub);
}

display(filtered);
}

/* Mobile Menu */

window.toggleMenu=function(){
document.querySelector(".nav-menu").classList.toggle("active");
}

/* Initial Load */

loadData();

<script>

window.goHome=function(){
window.location.href="index.html";
}

</script>

</body>
</html>o
