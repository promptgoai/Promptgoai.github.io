<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptGoAI - Best AI Prompts</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
}

header {
    padding: 60px 20px;
    text-align: center;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
}

header h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

header p {
    font-size: 18px;
    opacity: 0.9;
}

.search-box {
    text-align: center;
    margin: 30px;
}

.search-box input {
    width: 80%;
    max-width: 400px;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}

.container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    padding: 20px;
}

.card {
    background: #1e293b;
    width: 300px;
    margin: 15px;
    padding: 20px;
    border-radius: 12px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card h3 {
    margin-top: 0;
}

button {
    margin-top: 10px;
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}
</style>
</head>

<body>

<header>
    <h1>PromptGoAI</h1>
    <p>Explore Powerful AI Prompts for ChatGPT & Gemini</p>
</header>

<div class="search-box">
    <input type="text" id="search" placeholder="Search prompts...">
</div>

<div class="container" id="promptContainer">

    <div class="card">
        <h3>Instagram Caption Generator</h3>
        <p id="p1">Write 10 viral Instagram captions for a travel photo.</p>
        <button onclick="copyText('p1')">Copy Prompt</button>
    </div>

    <div class="card">
        <h3>Blog Writer</h3>
        <p id="p2">Write a 1000-word SEO blog on AI future trends.</p>
        <button onclick="copyText('p2')">Copy Prompt</button>
    </div>

    <div class="card">
        <h3>Business Idea Generator</h3>
        <p id="p3">Give me 5 unique online business ideas under $100 budget.</p>
        <button onclick="copyText('p3')">Copy Prompt</button>
    </div>

</div>

<script>
function copyText(id) {
    const text = document.getElementById(id).innerText;
    navigator.clipboard.writeText(text);
    alert("Prompt Copied!");
}

document.getElementById("search").addEventListener("keyup", function() {
    let value = this.value.toLowerCase();
    let cards = document.getElementsByClassName("card");
    for (let i = 0; i < cards.length; i++) {
        let text = cards[i].innerText.toLowerCase();
        cards[i].style.display = text.includes(value) ? "block" : "none";
    }
});
</script>

</body>
</html>
