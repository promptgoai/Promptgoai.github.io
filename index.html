<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Prompt Detail</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<section class="container">

<div id="promptDetail"></div>

<h3 style="margin-top:40px;color:#38bdf8">
🔥 Related Prompts
</h3>

<div class="cards" id="recommendBox"></div>

</section>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
getFirestore,
doc,
getDoc,
query,
collection,
where,
limit,
getDocs
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app=initializeApp({
apiKey:"PASTE_FIREBASE_KEY",
authDomain:"promptgoai.firebaseapp.com",
projectId:"promptgoai",
storageBucket:"promptgoai.firebasestorage.app",
appId:"1:promptgoai:web:a34bdeba6954ec69272b31"
});

const db=getFirestore(app);

/* URL Parameter */

const url=new URLSearchParams(window.location.search);
const id=url.get("id");

/* Prompt Load */

async function loadPrompt(){

const snap=await getDoc(doc(db,"prompts",id));

if(!snap.exists()) return;

let p=snap.data();

/* Prompt Detail UI */

document.getElementById("promptDetail").innerHTML=`

<div class="card">

<img src="${p.image||''}" loading="lazy">

<h2>${p.title}</h2>

<button class="btn" onclick="togglePrompt()">
View Prompt
</button>

<p id="fullPrompt" style="display:none">
${p.text}
</p>

<button class="btn" onclick="hidePrompt()"
id="hideBtn" style="display:none">
Hide Prompt
</button>

<button class="btn" onclick="copyPrompt()">
Copy Prompt
</button>

</div>
`;

/* Recommendation Load */

loadRecommendation(p.category);

}

/* Recommendation Engine */

async function loadRecommendation(category){

const box=document.getElementById("recommendBox");

const q=query(
collection(db,"prompts"),
where("category","==",category),
limit(5)
);

const snap=await getDocs(q);

box.innerHTML="";

snap.forEach(d=>{

if(d.id===id) return;

let p=d.data();

box.innerHTML+=`

<div class="card">

<img src="${p.image||''}" loading="lazy"
onerror="this.style.display='none'">

<h3 onclick="openRecommend('${d.id}')"
style="color:#38bdf8;cursor:pointer">
${p.title}
</h3>

<p>${p.text.substring(0,80)}...</p>

</div>
`;

});

}

/* Recommendation Routing */

window.openRecommend=function(pid){
window.location.href="prompt.html?id="+pid;
}

/* Toggle Prompt */

window.togglePrompt=function(){
document.getElementById("fullPrompt").style.display="block";
document.getElementById("hideBtn").style.display="inline-block";
}

window.hidePrompt=function(){
document.getElementById("fullPrompt").style.display="none";
document.getElementById("hideBtn").style.display="none";
}

window.copyPrompt=function(){
let text=document.getElementById("fullPrompt").innerText;
navigator.clipboard.writeText(text);
alert("Copied ✅");
}

loadPrompt();

</script>

</body>
</html>
