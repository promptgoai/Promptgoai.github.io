<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PromptGoAI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
<h1>PromptGoAI</h1>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="all-prompts.html">All Prompts</a></li>
</ul>
</nav>

<section class="hero">
<h2>🚀 Best AI Prompt Platform</h2>
<p>High quality prompts for creators.</p>
<a href="all-prompts.html" class="btn">Explore Prompts</a>
</section>

<section class="section">
<h2>🔥 Trending Prompts</h2>
<div class="cards" id="trendingBox"></div>
</section>

<footer>© 2026 PromptGoAI</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, getDocs, updateDoc, doc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey:"PASTE_YOUR_REAL_API_KEY",
authDomain:"promptgoai.firebaseapp.com",
projectId:"promptgoai",
storageBucket:"promptgoai.firebasestorage.app",
messagingSenderId:"500683349924",
appId:"1:500683349924:web:a34bdeba6954ec69272b31"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* LIKE */
window.likePrompt = async function(id){
await updateDoc(doc(db,"prompts",id),{likes:increment(1)});
loadTrending();
}

/* VIEW */
window.viewPrompt = async function(id){
await updateDoc(doc(db,"prompts",id),{views:increment(1)});
}

/* COPY */
window.copyPrompt = function(text){
navigator.clipboard.writeText(text).then(()=>{
alert("Copied ✅");
});
}

/* READ MORE */
window.toggleReadMore = function(id,fullText){
let el=document.getElementById("preview-"+id);

if(el.dataset.expanded==="true"){
el.innerText=fullText.substring(0,80)+"...";
el.dataset.expanded="false";
}else{
el.innerText=fullText;
el.dataset.expanded="true";
viewPrompt(id);
}
}

async function loadTrending(){
const q=query(collection(db,"prompts"),orderBy("created","desc"),limit(6));
const snap=await getDocs(q);

const box=document.getElementById("trendingBox");
box.innerHTML="";

snap.forEach(d=>{
let p=d.data();
let preview=p.text.length>80?p.text.substring(0,80)+"...":p.text;

box.innerHTML+=`
<div class="card">
<img src="${p.image||''}" onerror="this.style.display='none'">
<h3>${p.title}</h3>

<p id="preview-${d.id}" data-expanded="false">
${preview}
</p>

<div class="meta">
<span>❤️ ${p.likes||0}</span>
<span>👁 ${p.views||0}</span>
</div>

<button class="btn" onclick="toggleReadMore('${d.id}', ${JSON.stringify(p.text)})">
Read More
</button>

<button class="btn" onclick="copyPrompt(${JSON.stringify(p.text)})">
Copy
</button>

<button class="btn" onclick="likePrompt('${d.id}')">
Like
</button>

</div>`;
});
}

loadTrending();
</script>

</body>
</html>
