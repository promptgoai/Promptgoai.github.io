<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptGoAI - Best AI Prompt Platform</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0f172a;
color:white;
}

nav{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 8%;
background:#0b1220;
}

nav h1{
color:#38bdf8;
}

nav ul{
display:flex;
gap:20px;
list-style:none;
}

nav ul li a{
color:white;
text-decoration:none;
font-weight:bold;
}

.cat-menu{
padding:20px 8%;
background:#1e293b;
display:flex;
flex-wrap:wrap;
gap:15px;
justify-content:center;
}

.cat-menu a{
color:white;
text-decoration:none;
background:#2563eb;
padding:10px 18px;
border-radius:25px;
}

.hero{
padding:100px 8%;
text-align:center;
}

.hero h2{
font-size:42px;
margin-bottom:20px;
}

.hero p{
color:#cbd5e1;
margin-bottom:30px;
font-size:18px;
}

.hero input{
width:80%;
padding:16px;
border-radius:12px;
border:none;
margin-top:25px;
}

.btn{
display:inline-block;
padding:10px 20px;
background:#38bdf8;
color:#0f172a;
border:none;
border-radius:25px;
cursor:pointer;
font-weight:bold;
margin-top:15px;
}

.section{
padding:60px 8%;
text-align:center;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:25px;
margin-top:40px;
}

.card{
background:linear-gradient(145deg,#1e293b,#0f172a);
padding:20px;
border-radius:20px;
transition:0.3s;
box-shadow:0 10px 25px rgba(0,0,0,0.4);
}

.card:hover{
transform:translateY(-8px);
}

.card img{
width:100%;
border-radius:10px;
margin-bottom:15px;
}

.card h3{
color:#38bdf8;
margin-bottom:10px;
font-size:18px;
}

footer{
background:#0b1220;
padding:20px;
text-align:center;
color:#94a3b8;
margin-top:60px;
}
</style>
</head>

<body>

<nav>
<h1>PromptGoAI</h1>
<ul>
<li><a href="index.html">Home</a></li>
<li><a href="chatgpt.html">ChatGPT</a></li>
<li><a href="gemini.html">Gemini</a></li>
<li><a href="all-prompts.html">All Prompts</a></li>
</ul>
</nav>

<div class="cat-menu">
<a href="all-prompts.html">All</a>
<a href="all-prompts.html?cat=gemini">Gemini</a>
<a href="all-prompts.html?cat=chatgpt">ChatGPT</a>
<a href="all-prompts.html?cat=business">Business</a>
</div>

<section class="hero">
<h2>🚀 Best AI Prompt Platform</h2>
<p>High quality prompts for creators, students & developers.</p>
<input type="text" id="searchBox" placeholder="Search prompts...">
<br>
<a href="all-prompts.html" class="btn">Explore Prompts</a>
</section>

<section class="section">
<h2>🔥 Trending Prompts</h2>
<div class="cards" id="trendingBox"></div>
</section>

<footer>
© 2026 PromptGoAI | Built with ❤️ by Arsh
</footer>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyAbTMOKPD5_YE0Z0iKNdZvl_40plYxCyug",
authDomain: "promptgoai.firebaseapp.com",
projectId: "promptgoai",
storageBucket: "promptgoai.firebasestorage.app",
messagingSenderId: "500683349924",
appId: "1:500683349924:web:a34bdeba6954ec69272b31"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadTrending(){

const box = document.getElementById("trendingBox");

try{

const q = query(
collection(db,"prompts"),
orderBy("created","desc"),
limit(6)
);

const snapshot = await getDocs(q);

box.innerHTML="";

snapshot.forEach(doc=>{
let p = doc.data();

let shortText = p.text ? p.text.split("\n")[0].substring(0,80) : "No Prompt";
let imageTag = p.image ? `<img src="${p.image}" onerror="this.style.display='none'">` : "";

box.innerHTML += `
<div class="card">
${imageTag}
<h3>${shortText}...</h3>
<button class="btn" onclick="copyText(\`${p.text}\`)">Copy</button>
</div>
`;
});

}catch(err){
box.innerHTML = "Error loading prompts.";
}

}

window.copyText = function(text){
navigator.clipboard.writeText(text);
alert("Prompt Copied ✅");
}

loadTrending();

</script>

</body>
</html>
