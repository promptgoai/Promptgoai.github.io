<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gemini Prompts - PromptGoAI</title>

<style>

/* ===== BODY ===== */
body{
margin:0;
font-family:Segoe UI, sans-serif;
background:#0f172a;
color:white;
}

/* ===== HEADER ===== */
header{
display:flex;
justify-content:space-between;
align-items:center;
background:#1e293b;
padding:15px 30px;
}

.logo{
font-size:20px;
font-weight:600;
}

nav a{
margin:0 10px;
text-decoration:none;
color:white;
font-size:14px;
}

nav a:hover{
color:#38bdf8;
}

.mode-btn{
background:#334155;
padding:6px 12px;
border-radius:6px;
cursor:pointer;
}

/* ===== CONTAINER ===== */
.container{
padding:30px;
max-width:1000px;
margin:auto;
}

/* ===== SEARCH ===== */
.search{
width:100%;
padding:12px;
border-radius:8px;
border:none;
margin-bottom:25px;
font-size:15px;
}

/* ===== FILTER ===== */
.filter{
margin-bottom:25px;
}

.filter button{
margin:6px;
padding:8px 14px;
border:none;
border-radius:6px;
cursor:pointer;
background:#2563eb;
color:white;
}

/* ===== CARD ===== */
.card{
background:#1e293b;
padding:20px;
margin-bottom:20px;
border-radius:12px;
transition:0.25s;
}

.card:hover{
transform:translateY(-4px);
}

/* Copy Button */
.copy{
margin-top:12px;
padding:7px 14px;
border:none;
border-radius:6px;
cursor:pointer;
background:#22c55e;
color:white;
}

/* Footer */
footer{
text-align:center;
padding:20px;
background:#1e293b;
margin-top:40px;
font-size:14px;
}

/* Light Mode */
.light{
background:#f1f5f9;
color:black;
}

.light header,
.light footer{
background:#e2e8f0;
color:black;
}

.light .card{
background:white;
}

</style>
</head>

<body>

<header>
<div class="logo">PromptGoAI</div>

<nav>
<a href="index.html">Home</a>
<a href="chatgpt.html">ChatGPT</a>
<a href="gemini.html">Gemini</a>
<a href="all-prompts.html">All Prompts</a>
</nav>

<div class="mode-btn" onclick="toggleMode()">Mode</div>
</header>

<div class="container">

<input type="text" id="search" class="search" placeholder="Search prompts...">

<div class="filter">
<button onclick="filterCat('all')">All</button>
<button onclick="filterCat('youtube')">YouTube</button>
<button onclick="filterCat('business')">Business</button>
<button onclick="filterCat('content')">Content</button>
</div>

<div id="count"></div>

<div id="prompts"></div>

</div>

<footer>
PromptGoAI © 2026 | Built by Arsh
</footer>

<script>

/* ===== PROMPTS ===== */

const prompts = [

{title:"Viral YouTube Hook Generator", text:"Generate 10 powerful viral YouTube hooks for AI niche videos.", cat:"youtube"},
{title:"10 Minute YouTube Script", text:"Write a 10 minute engaging YouTube script.", cat:"youtube"},
{title:"Faceless Channel Ideas", text:"Give 20 profitable faceless YouTube channel ideas.", cat:"youtube"},
{title:"Shorts Script Creator", text:"Create 30 viral YouTube Shorts scripts.", cat:"youtube"},
{title:"Thumbnail Text Ideas", text:"Generate 15 high CTR thumbnail text ideas.", cat:"youtube"},

{title:"Startup Roadmap", text:"Create a 90 day startup launch plan.", cat:"business"},
{title:"AI SaaS Ideas", text:"Give 15 AI SaaS business ideas.", cat:"business"},
{title:"Dropshipping Plan", text:"Create dropshipping strategy.", cat:"business"},
{title:"Personal Brand Plan", text:"Build 30 day personal branding roadmap.", cat:"business"},
{title:"High Income Skills", text:"List high income skills for 2026.", cat:"business"}

];

/* ===== RENDER ===== */

function render(list){

let html="";

list.forEach(p=>{
html+=`
<div class="card">
<h3>${p.title}</h3>
<p>${p.text}</p>
<button class="copy" onclick="copyText('${p.text}')">Copy</button>
</div>
`;
});

document.getElementById("prompts").innerHTML=html;
document.getElementById("count").innerHTML="Total Prompts: "+list.length;

}

/* ===== COPY ===== */

function copyText(text){
navigator.clipboard.writeText(text);
alert("Copied!");
}

/* ===== FILTER ===== */

function filterCat(cat){

if(cat==="all"){
render(prompts);
}else{
render(prompts.filter(p=>p.cat===cat));
}

}

/* ===== SEARCH ===== */

document.getElementById("search").addEventListener("input",function(){

let value=this.value.toLowerCase();

let filtered=prompts.filter(p=>
p.title.toLowerCase().includes(value) ||
p.text.toLowerCase().includes(value)
);

render(filtered);

});

/* ===== MODE ===== */

function toggleMode(){
document.body.classList.toggle("light");
}

render(prompts);

</script>

</body>
</html>
