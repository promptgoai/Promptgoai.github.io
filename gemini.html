<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gemini Prompts - PromptGoAI</title>
<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  transition:0.3s;
}
header{
  background:#1e1e1e;
  padding:15px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
}
.toggle{
  position:absolute;
  right:20px;
  top:15px;
  cursor:pointer;
  padding:5px 10px;
  background:#444;
  border-radius:5px;
}
.container{
  padding:20px;
}
.search{
  width:100%;
  padding:10px;
  margin-bottom:20px;
  border-radius:5px;
  border:none;
}
.filter button{
  margin:5px;
  padding:8px 12px;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
.card{
  background:#1c1c1c;
  padding:15px;
  margin-bottom:15px;
  border-radius:8px;
}
.copy{
  margin-top:10px;
  padding:5px 10px;
  background:#00c853;
  border:none;
  border-radius:5px;
  cursor:pointer;
}
footer{
  text-align:center;
  padding:15px;
  background:#1e1e1e;
  margin-top:20px;
}
.light{
  background:#f4f4f4;
  color:black;
}
.light header,
.light footer{
  background:#ddd;
  color:black;
}
.light .card{
  background:white;
}
</style>
</head>
<body>

<header>
Gemini AI Prompts
<span class="toggle" onclick="toggleMode()">Mode</span>
</header>

<div class="container">

<input type="text" id="search" class="search" placeholder="Search prompts...">

<div class="filter">
<button onclick="filterCat('all')">All</button>
<button onclick="filterCat('youtube')">YouTube</button>
<button onclick="filterCat('business')">Business</button>
<button onclick="filterCat('content')">Content</button>
</div>

<div id="count"></div>

<div id="prompts"></div>

</div>

<footer>
PromptGoAI © 2026 | Built by Arsh
</footer>

<script>
const prompts = [
{title:"Viral YouTube Script",
text:"Create a 10 minute viral YouTube script with strong hook and storytelling.",
cat:"youtube"},
{title:"Faceless Channel Idea",
text:"Give 20 faceless YouTube channel ideas with earning potential.",
cat:"youtube"},
{title:"Startup Plan",
text:"Create a 90 day startup launch roadmap with daily tasks.",
cat:"business"},
{title:"Instagram Content Plan",
text:"Generate 30 days Instagram content plan for AI niche.",
cat:"content"},
{title:"AI SaaS Idea",
text:"Give 10 AI SaaS ideas with revenue model explained.",
cat:"business"}
];

function render(list){
let html="";
list.forEach(p=>{
html+=`
<div class="card">
<h3>${p.title}</h3>
<p>${p.text}</p>
<button class="copy" onclick="copyText('${p.text}')">Copy</button>
</div>`;
});
document.getElementById("prompts").innerHTML=html;
document.getElementById("count").innerHTML="Total Prompts: "+list.length;
}

function copyText(text){
navigator.clipboard.writeText(text);
alert("Copied!");
}

function filterCat(cat){
if(cat==="all"){
render(prompts);
}else{
render(prompts.filter(p=>p.cat===cat));
}
}

document.getElementById("search").addEventListener("input",function(){
let value=this.value.toLowerCase();
let filtered=prompts.filter(p=>
p.title.toLowerCase().includes(value) ||
p.text.toLowerCase().includes(value)
);
render(filtered);
});

function toggleMode(){
document.body.classList.toggle("light");
}

render(prompts);
</script>

</body>
</html>
