<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gemini Prompts - PromptGoAI</title>
<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:#0f172a;
  color:white;
}
header{
  background:#1e293b;
  padding:18px;
  text-align:center;
  font-size:22px;
  font-weight:600;
  position:relative;
}
.toggle{
  position:absolute;
  right:20px;
  top:15px;
  cursor:pointer;
  padding:6px 12px;
  background:#334155;
  border-radius:6px;
}
.container{
  padding:25px;
  max-width:900px;
  margin:auto;
}
.search{
  width:100%;
  padding:12px;
  margin-bottom:20px;
  border-radius:6px;
  border:none;
  font-size:15px;
}
.filter{
  margin-bottom:20px;
}
.filter button{
  margin:5px;
  padding:8px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#2563eb;
  color:white;
}
.card{
  background:#1e293b;
  padding:18px;
  margin-bottom:18px;
  border-radius:10px;
  transition:0.2s;
}
.card:hover{
  transform:translateY(-3px);
}
.copy{
  margin-top:10px;
  padding:6px 12px;
  background:#22c55e;
  border:none;
  border-radius:6px;
  cursor:pointer;
  color:white;
}
footer{
  text-align:center;
  padding:18px;
  background:#1e293b;
  margin-top:40px;
  font-size:14px;
}
.light{
  background:#f1f5f9;
  color:black;
}
.light header,
.light footer{
  background:#e2e8f0;
  color:black;
}
.light .card{
  background:white;
}
</style>
</head>
<body>

<header>
Gemini AI Prompts
<span class="toggle" onclick="toggleMode()">Mode</span>
</header>

<div class="container">

<input type="text" id="search" class="search" placeholder="Search prompts...">

<div class="filter">
<button onclick="filterCat('all')">All</button>
<button onclick="filterCat('youtube')">YouTube</button>
<button onclick="filterCat('business')">Business</button>
<button onclick="filterCat('content')">Content</button>
</div>

<div id="count"></div>

<div id="prompts"></div>

</div>

<footer>
PromptGoAI © 2026 | Built by Arsh
</footer>

<script>
const prompts = [

{title:"Viral YouTube Hook Generator", text:"Generate 10 powerful viral YouTube hooks for AI niche videos.", cat:"youtube"},
{title:"10 Minute YouTube Script", text:"Write a 10 minute engaging YouTube script with storytelling and strong retention.", cat:"youtube"},
{title:"Faceless Channel Ideas", text:"Give 20 profitable faceless YouTube channel ideas with monetization method.", cat:"youtube"},
{title:"Shorts Script Creator", text:"Create 30 viral YouTube Shorts scripts under 60 seconds.", cat:"youtube"},
{title:"Thumbnail Text Ideas", text:"Generate 15 high CTR YouTube thumbnail text ideas.", cat:"youtube"},

{title:"Startup Roadmap", text:"Create a 90 day startup launch plan with weekly milestones.", cat:"business"},
{title:"AI SaaS Ideas", text:"Give 15 AI SaaS business ideas with target audience and pricing.", cat:"business"},
{title:"Dropshipping Plan", text:"Create a step by step dropshipping launch strategy with zero budget.", cat:"business"},
{title:"Personal Brand Plan", text:"Build a 30 day personal branding roadmap for Instagram.", cat:"business"},
{title:"High Income Skills", text:"List 10 high income skills to learn in 2026 with roadmap.", cat:"business"},

{title:"Instagram Content Calendar", text:"Generate 30 days Instagram content plan for AI niche.", cat:"content"},
{title:"Twitter Thread Creator", text:"Write a viral Twitter thread about AI money making.", cat:"content"},
{title:"LinkedIn Post Writer", text:"Create 5 professional LinkedIn posts about startup growth.", cat:"content"},
{title:"Blog Outline Generator", text:"Generate SEO optimized blog outline on AI tools.", cat:"content"},
{title:"Storytelling Post", text:"Write an emotional storytelling post for audience engagement.", cat:"content"},

{title:"Ebook Outline", text:"Create a complete ebook outline about making money with AI.", cat:"content"},
{title:"Sales Page Copy", text:"Write a high converting sales page for AI course.", cat:"business"},
{title:"Cold DM Script", text:"Generate a cold DM script to get freelance clients.", cat:"business"},
{title:"Freelance Gig Description", text:"Write Fiverr gig description for AI prompt services.", cat:"business"},
{title:"Digital Product Ideas", text:"Give 20 digital product ideas that can be sold online.", cat:"business"},

{title:"Affiliate Marketing Plan", text:"Create beginner friendly affiliate marketing roadmap.", cat:"business"},
{title:"Reel Script Generator", text:"Write 15 viral Instagram reel scripts.", cat:"content"},
{title:"Motivational Speech", text:"Write a powerful 2 minute motivational speech.", cat:"content"},
{title:"Course Curriculum", text:"Design complete course curriculum for AI beginners.", cat:"business"},
{title:"Landing Page Copy", text:"Create a modern landing page copy for SaaS tool.", cat:"business"},

{title:"Email Marketing Sequence", text:"Write 7 day email marketing sequence for product launch.", cat:"business"},
{title:"Chatbot Script", text:"Create chatbot conversation flow for website.", cat:"business"},
{title:"Lead Magnet Ideas", text:"Generate 15 lead magnet ideas for AI audience.", cat:"business"},
{title:"Product Description", text:"Write high converting product description for digital product.", cat:"content"},
{title:"Viral Headline Generator", text:"Generate 20 clickbait style viral headlines.", cat:"content"},

{title:"Instagram Bio Creator", text:"Write 10 powerful Instagram bio options for AI creator.", cat:"content"},
{title:"Podcast Script", text:"Create 15 minute podcast script about AI business.", cat:"content"},
{title:"Ad Copy Generator", text:"Write Facebook ad copy for AI course.", cat:"business"},
{title:"Resume Optimizer", text:"Rewrite resume summary for tech job using AI skills.", cat:"business"},
{title:"Niche Research Prompt", text:"Analyze profitable niches with low competition.", cat:"business"},

{title:"YouTube SEO Plan", text:"Create YouTube SEO strategy for fast growth.", cat:"youtube"},
{title:"Brand Name Ideas", text:"Generate 25 unique AI startup brand name ideas.", cat:"business"},
{title:"Logo Prompt", text:"Create AI image prompt for modern tech logo design.", cat:"content"},
{title:"AI Tool Comparison", text:"Compare top 5 AI tools for content creators.", cat:"content"},
{title:"Product Launch Plan", text:"Create step by step digital product launch plan.", cat:"business"},

{title:"Time Management Plan", text:"Create productivity system for entrepreneurs.", cat:"business"},
{title:"Growth Strategy", text:"Build 6 month growth strategy for AI startup.", cat:"business"},
{title:"Course Sales Script", text:"Write webinar script to sell online course.", cat:"business"},
{title:"Reel Hook Ideas", text:"Generate 20 scroll stopping reel hooks.", cat:"content"},
{title:"YouTube Description SEO", text:"Write SEO optimized YouTube description template.", cat:"youtube"},

{title:"AI Automation Ideas", text:"Give 15 AI automation ideas for businesses.", cat:"business"},
{title:"Freelancer Proposal", text:"Write winning Upwork proposal template.", cat:"business"},
{title:"Blog Intro Generator", text:"Write engaging blog introduction paragraph.", cat:"content"},
{title:"Content Repurpose Plan", text:"Turn 1 long video into 10 pieces of content.", cat:"content"},
{title:"Money Making Blueprint", text:"Create step by step blueprint to earn using AI tools.", cat:"business"}

];

function render(list){
let html="";
list.forEach(p=>{
html+=`
<div class="card">
<h3>${p.title}</h3>
<p>${p.text}</p>
<button class="copy" onclick="copyText('${p.text}')">Copy</button>
</div>`;
});
document.getElementById("prompts").innerHTML=html;
document.getElementById("count").innerHTML="Total Prompts: "+list.length;
}

function copyText(text){
navigator.clipboard.writeText(text);
alert("Copied!");
}

function filterCat(cat){
if(cat==="all"){
render(prompts);
}else{
render(prompts.filter(p=>p.cat===cat));
}
}

document.getElementById("search").addEventListener("input",function(){
let value=this.value.toLowerCase();
let filtered=prompts.filter(p=>
p.title.toLowerCase().includes(value) ||
p.text.toLowerCase().includes(value)
);
render(filtered);
});

function toggleMode(){
document.body.classList.toggle("light");
}

render(prompts);
</script>

</body>
</html>
